name: Camera debug APK and tests
on:
  push:
    branches: [codex/camera-188-build]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build dependencies
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleDefaultDebug :app:testDefaultDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photon-camera-debug-and-test-reports
          path: |
            app/build/outputs/apk/default/debug/*.apk
            app/build/reports/tests/
          if-no-files-found: warn
